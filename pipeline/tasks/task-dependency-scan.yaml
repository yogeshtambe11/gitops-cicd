apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dependency-scan
  namespace: gitops-cicd
spec:
  workspaces:
    - name: source
  steps:
    - name: run-pip-audit
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        python3 -m pip install --upgrade pip pip-audit
        echo "=== Running pip-audit Dependency Vulnerability Scan ==="
        pip-audit -r src/requirements.txt || {
          echo "⚠️ Security scan identified package vulnerabilities. Review audit log above."
          exit 0
        }
