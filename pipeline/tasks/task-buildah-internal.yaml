apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-internal
  namespace: gitops-cicd
spec:
  params:
    - name: IMAGE
      type: string
    - name: TAG
      type: string
  workspaces:
    - name: source
  results:
    - name: IMAGE_DIGEST
      description: Digest of the produced container image
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.35.0
      workingDir: $(workspaces.source.path)/src
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      script: |
        set -e
        TARGET_IMAGE="$(params.IMAGE):$(params.TAG)"

        echo "=== Building Image from src/ ==="
        buildah --storage-driver=vfs bud --format=docker -f Dockerfile -t "${TARGET_IMAGE}" .

        echo "=== Pushing to Internal Registry ==="
        REG_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
        if [ -n "$REG_TOKEN" ]; then
          buildah --storage-driver=vfs push --tls-verify=false --creds="serviceaccount:${REG_TOKEN}" "${TARGET_IMAGE}" "docker://${TARGET_IMAGE}"
        else
          buildah --storage-driver=vfs push --tls-verify=false "${TARGET_IMAGE}" "docker://${TARGET_IMAGE}"
        fi

        echo "=== Inspecting Image Digest ==="
        DIGEST=$(buildah --storage-driver=vfs inspect --format '{{.FromImageDigest}}' "${TARGET_IMAGE}" 2>/dev/null || true)
        if [ -z "$DIGEST" ] || [ "$DIGEST" = "<nil>" ]; then
          DIGEST=$(buildah --storage-driver=vfs inspect --type image --format '{{.Digest}}' "${TARGET_IMAGE}" 2>/dev/null || true)
        fi
        if [ -z "$DIGEST" ] || [ "$DIGEST" = "<nil>" ]; then
          DIGEST="$(params.TAG)"
        fi

        echo -n "${DIGEST}" > $(results.IMAGE_DIGEST.path)
        echo "Image digest saved: ${DIGEST}"
