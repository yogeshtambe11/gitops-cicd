apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-pipeline-pvc
  namespace: gitops-cicd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: gitops-cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-edit
  namespace: gitops-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: gitops-cicd
