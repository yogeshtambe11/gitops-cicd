apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sample-app
  labels:
    app: devops-sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-sample-app
  template:
    metadata:
      labels:
        app: devops-sample-app
    spec:
      containers:
      - name: app
        image: image-registry.openshift-image-registry.svc:5000/gitops-cicd/devops-sample-app:c796796a8b46a34bfa2df6d52ee0f954dbc853b4
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
